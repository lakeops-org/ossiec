# Fan-out (reverse many→one) consumer join for Layer 2 A.5 tests.
version: "0.2.0.dev0"
name: fanout_layer2
datasets:
  - name: orders
    source: orders
    primary_key: [id]
    fields:
      - { name: id, expression: { sql: order_id } }
    metrics:
      - name: order_count
        expression: { sql: COUNT(*) }
  - name: order_items
    source: order_items
    primary_key: [line_id]
    fields:
      - { name: order_id, expression: { sql: order_id } }
      - { name: line_id, expression: { sql: line_id } }
relationships:
  - name: items_to_orders
    from: order_items
    to: orders
    from_columns: [order_id]
    to_columns: [id]
