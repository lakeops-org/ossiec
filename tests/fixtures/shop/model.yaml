version: "0.2.0.dev0"
name: shop
description: Orders, customers and products. The test model for ossiec's correctness suite.
ai_context:
  instructions: Revenue is in dollars. Use completed_revenue for recognised revenue.
datasets:
  - name: orders
    source: orders
    primary_key: [id]
    fields:
      - { name: id, expression: { sql: order_id }, datatype: Integer }
      - { name: customer_id, expression: { sql: customer_id }, datatype: Integer }
      - { name: product_id, expression: { sql: product_id }, datatype: Integer }
      - { name: order_date, expression: { sql: order_date }, datatype: Date, dimension: {} }
      - { name: revenue, expression: { sql: amount_cents / 100.0 }, datatype: Decimal }
      - { name: status, expression: { sql: status }, datatype: String, dimension: {} }
      - { name: amount_cents, expression: { sql: amount_cents }, datatype: Integer }
      # A portable expression plus one native expression per engine; requests can prefer the engine's own.
      - name: order_yyyymm
        datatype: Integer
        expression:
          sql: "EXTRACT(YEAR FROM order_date) * 100 + EXTRACT(MONTH FROM order_date)"
          dialects:
            - { dialect: DUCKDB, expression: "CAST(strftime(order_date, '%Y%m') AS INTEGER)" }
            - { dialect: POSTGRES, expression: "CAST(to_char(order_date, 'YYYYMM') AS INTEGER)" }
            - { dialect: TRINO, expression: "CAST(date_format(order_date, '%Y%m') AS INTEGER)" }
            - { dialect: STARROCKS, expression: "CAST(date_format(order_date, '%Y%m') AS INT)" }
            - { dialect: CLICKHOUSE, expression: "toYYYYMM(order_date)" }
            - { dialect: MYSQL, expression: "CAST(DATE_FORMAT(order_date, '%Y%m') AS UNSIGNED)" }
    metrics:
      - name: order_count
        expression: { sql: COUNT(*) }
        description: Number of orders
      - { name: gross_revenue, expression: { sql: SUM(revenue) } }

  - name: customers
    # A query source: soft-deleted customers are not customers.
    source: SELECT * FROM raw_customers WHERE NOT deleted
    primary_key: [id]
    fields:
      - { name: id, expression: { sql: customer_id }, datatype: Integer }
      - { name: name, expression: { sql: name }, datatype: String }
      - { name: region, expression: { sql: region }, datatype: String, dimension: {} }
      - { name: segment, expression: { sql: segment }, datatype: String, dimension: {} }
    metrics:
      - { name: known_customers, expression: { sql: COUNT(id) } }
      - { name: distinct_customers, expression: { sql: COUNT(DISTINCT id) } }

  - name: products
    source: products
    primary_key: [id]
    fields:
      - { name: id, expression: { sql: product_id }, datatype: Integer }
      - { name: category, expression: { sql: category }, datatype: String, dimension: {} }
      - { name: stock, expression: { sql: stock }, datatype: Integer }
    metrics:
      - { name: stock_units, expression: { sql: SUM(stock) } }
      - { name: product_count, expression: { sql: COUNT(id) } }
      - { name: average_stock, expression: { sql: AVG(stock) } }

relationships:
  - { name: orders_to_customers, from: orders, to: customers, from_columns: [customer_id], to_columns: [id] }
  - { name: orders_to_products, from: orders, to: products, from_columns: [product_id], to_columns: [id] }

metrics:
  - name: total_revenue
    expression: { sql: SUM(orders.revenue) }
    description: Gross revenue in dollars
    ai_context: { synonyms: [sales, gross revenue, GMV] }
  - name: completed_revenue
    expression: { sql: "SUM(orders.revenue) FILTER (WHERE orders.status = 'completed')" }
  - name: avg_order_value
    expression: { sql: AVG(orders.revenue) }
  - name: buying_customers
    expression: { sql: COUNT(DISTINCT customers.id) }
  - name: revenue_per_customer
    expression: { sql: "SUM(orders.revenue) / NULLIF(COUNT(DISTINCT customers.id), 0)" }
  - name: total_stock
    expression: { sql: SUM(products.stock) }
    description: Units in stock
  - name: revenue_per_stock_unit
    expression: { sql: "SUM(orders.revenue) / NULLIF(SUM(products.stock), 0)" }
  # Window metrics: computed over the grouped result, when a request sets `deferredMetrics`.
  - name: cumulative_revenue
    expression: { sql: "SUM(SUM(orders.revenue)) OVER (ORDER BY orders.order_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)" }
    description: Running total of revenue
  - name: revenue_change
    expression: { sql: "SUM(orders.revenue) - LAG(SUM(orders.revenue), 1) OVER (ORDER BY orders.order_date)" }
    description: Revenue change from the previous period
  - name: revenue_change_to_next
    expression: { sql: "LEAD(SUM(orders.revenue), 1) OVER (ORDER BY orders.order_date) - SUM(orders.revenue)" }
    description: Revenue change to the next period
  - name: revenue_rank_in_region
    expression: { sql: "RANK() OVER (PARTITION BY customers.region ORDER BY SUM(orders.revenue) DESC)" }
  - name: stock_share
    expression: { sql: "SUM(products.stock) / SUM(SUM(products.stock)) OVER ()" }
    description: Share of all stock (over the groups in the result)
  # A ratio of two integer counts: true division on every engine (Postgres and Trino would truncate).
  - name: orders_per_customer
    expression: { sql: "COUNT(orders.id) / NULLIF(COUNT(DISTINCT customers.id), 0)" }
  # COUNT and AVG on the one side of a relationship, over their home dataset's rows.
  - name: products_sold
    expression: { sql: COUNT(products.id) }
    description: Products in the group
  - name: customer_count
    expression: { sql: COUNT(customers.id) }
  - name: avg_stock
    expression: { sql: AVG(products.stock) }
  # AVG of an integer column: engines disagree on the result type.
  - name: avg_amount_cents
    expression: { sql: AVG(orders.amount_cents) }
